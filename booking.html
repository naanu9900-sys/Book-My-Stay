<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Booking</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
<h1>🏨 Book My Stay</h1>

<nav>
<a href="index.html">Home</a>
<a href="rooms.html">Rooms</a>
<a href="booking.html">Booking</a>
<a href="profile.html">Profile</a>
<a href="login.html">Login</a>
</nav>
</header>

<section style="padding:40px;max-width:600px;margin:auto;">
<h2>Book Your Room</h2>

<form id="bookingForm">

<label>Full Name</label><br>
<input type="text" placeholder="Enter your name" required><br><br>

<label>Email</label><br>
<input type="email" placeholder="Enter your email" required><br><br>

<label>Room Type</label><br>
<select>
<option>Deluxe Room</option>
<option>Luxury Suite</option>
<option>Family Room</option>
</select><br><br>

<label>Check-In Date</label><br>
<input type="date" required><br><br>

<label>Check-Out Date</label><br>
<input type="date" required><br><br>

<label>Guests</label><br>
<input type="number" min="1" max="10" value="1"><br><br>

<button class="btn" type="submit">Confirm Booking</button>

</form>

</section>
<script>
document.getElementById("bookingForm").addEventListener("submit", async function(e){
    e.preventDefault();

    const form = e.target;

    const booking = {
        name: form.elements[0].value,
        email: form.elements[1].value,
        room: form.elements[2].value,
        checkin: form.elements[3].value,
        checkout: form.elements[4].value,
        guests: form.elements[5].value,
        amount: 5000
    };

    try {
        const res = await fetch("/save-booking", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(booking)
        });

        const data = await res.json();

        if (data.success) {
            alert("🎉 Booking Successful!");
            window.location.href = "payment.html";
        } else {
            alert("Booking failed!");
        }
    } catch (err) {
        console.error(err);
        alert("Server error!");
    }
});
</script>
</body>
</html>
