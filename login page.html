<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Book my stay</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #1d1a3b 0%, #42286f 40%, #ff5fb7 100%);
      --card-bg: rgba(255, 255, 255, 0.12);
      --card-border: rgba(255, 255, 255, 0.25);
      --accent: #ff8ce2;
      --accent-hover: #ff57c2;
      --text-main: #f7f3ff;
      --text-muted: #d4c8ea;
      --input-bg: rgba(255,255,255,0.14);
      --input-border: rgba(255,255,255,0.28);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: var(--bg-gradient);
      position: relative;
      color: var(--text-main);
      overflow: hidden;
    }

    .login-container {
      width: 100%;
      max-width: 420px;
      padding: 44px 36px;
      background: var(--card-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--card-border);
      border-radius: 28px;
      box-shadow: 0 32px 72px -28px rgba(0, 0, 0, 0.65);
      position: relative;
      z-index: 2;
    }

    /* Blurred blended background photo behind the login card */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image: linear-gradient(rgba(3,7,18,0.45), rgba(30,20,55,0.45)), url('https://images.unsplash.com/photo-1501117716987-c8e2bfb2b1b0?auto=format&fit=crop&w=1600&q=80');
      background-size: cover;
      background-position: center;
      filter: blur(10px) saturate(120%);
      transform: scale(1.03);
      opacity: 0.9;
      z-index: 0;
      pointer-events: none;
    }

    .header {
      margin-bottom: 32px;
      text-align: center;
    }

    .header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2.4rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 10px;
      background: linear-gradient(90deg, #ffd1ff, #ff8ce2);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 3px 18px rgba(255, 140, 194, 0.28);
    }

    .header p {
      color: var(--text-muted);
      font-size: 0.95rem;
      letter-spacing: 0.02em;
    }

    .input-group {
      margin-bottom: 20px;
      position: relative;
    }

    .input-group input {
      width: 100%;
      padding: 16px 18px;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 16px;
      color: var(--text-main);
      font-size: 0.98rem;
      outline: none;
      transition: transform 0.2s ease, border-color 0.2s ease, background 0.2s ease;
    }

    .input-group input::placeholder {
      color: rgba(255,255,255,0.68);
    }

    .input-group input:focus {
      border-color: #ffd1ff;
      background: rgba(255,255,255,0.18);
      box-shadow: 0 0 0 5px rgba(255, 140, 226, 0.16);
      transform: translateY(-1px);
    }

    .options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.825rem;
      margin-bottom: 24px;
      color: var(--text-muted);
    }

    .remember-me {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }

    .remember-me input {
      accent-color: #ff8ce2;
    }

    .forgot-pass {
      color: rgba(255,255,255,0.78);
      text-decoration: none;
      transition: color 0.2s, text-shadow 0.2s;
    }

    .forgot-pass:hover {
      color: var(--text-main);
    }

    .btn {
      position: relative;
      overflow: hidden;
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    .btn-primary {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 16px;
      background: linear-gradient(135deg, #ff8ce2 0%, #ff57c2 100%);
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 16px 30px rgba(255, 92, 170, 0.2);
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 20px 40px rgba(255, 92, 170, 0.28);
    }

    .btn-primary:active,
    .btn-ghost:active {
      transform: scale(0.98);
    }

    .btn-ghost {
      background: rgba(255,255,255,0.04);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.2);
      transition: transform 0.2s ease, border-color 0.2s ease, background 0.2s ease;
    }

    .btn-ghost:hover {
      background: rgba(255,255,255,0.12);
      border-color: rgba(255,255,255,0.32);
    }

    .ripple {
      position: absolute;
      border-radius: 50%;
      transform: scale(0);
      background: rgba(255,255,255,0.35);
      animation: ripple 0.6s ease-out;
      pointer-events: none;
    }

    @keyframes ripple {
      to {
        transform: scale(4);
        opacity: 0;
      }
    }

    .footer-text {
      margin-top: 24px;
      text-align: center;
      font-size: 0.88rem;
      color: rgba(255,255,255,0.75);
    }

    .footer-text a {
      color: #ffd1ff;
      text-decoration: none;
      font-weight: 700;
    }

    .footer-text a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="header">
      <h1>Book my stay</h1>
      <p>Enter your details to sign in</p>
    </div>

    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="input-group">
        <input id="email" type="email" placeholder="Email address" required />
      </div>

      <div class="input-group">
        <input id="password" type="password" placeholder="Password" required />
      </div>

      <div class="options">
        <label class="remember-me">
          <input type="checkbox" /> Remember me
        </label>
        <a href="#" class="forgot-pass">Forgot password?</a>
      </div>

      <button type="submit" class="btn-primary">Sign in</button>
    </form>

    <p class="footer-text">
      Don't have an account? <a href="#">Sign up</a>
    </p>
  </div>

</body>
<script>
  async function handleLogin(e){
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value.trim();
    try{
      const res = await fetch('/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();
      if(res.ok && data.success){
        window.location.href = 'booking.html';
      } else {
        // server reachable but auth failed
        alert(data.message || 'Login failed');
      }
    } catch(err){
      // Network error — attempt offline/local auth fallback
      console.warn('Login fetch failed, attempting offline fallback', err);
      const ok = attemptLocalAuth(email, password);
      if(ok){
        window.location.href = 'booking.html';
      } else {
        alert('Network error and offline auth failed. You can register locally by signing up first.');
      }
    }
  }

  function getLocalUsers(){
    try{ return JSON.parse(localStorage.getItem('localUsers') || '{}'); } catch(e){ return {}; }
  }

  function saveLocalUsers(obj){
    try{ localStorage.setItem('localUsers', JSON.stringify(obj)); } catch(e){ console.warn('Failed saving local users', e); }
  }

  // Offline auth: if user exists and password matches, log in.
  // If user does not exist, create a local account (auto-register) and log in.
  function attemptLocalAuth(email, password){
    if(!email || !password) return false;
    const users = getLocalUsers();
    if(users[email]){
      if(users[email] === password){
        alert('Logged in (offline) as ' + email);
        return true;
      }
      return false;
    }
    // Auto-register locally and log in
    users[email] = password;
    saveLocalUsers(users);
    alert('No network — account created locally and logged in as ' + email);
    return true;
  }

  function attachButtonAnimation(){
    document.querySelectorAll('.btn').forEach(button => {
      button.addEventListener('click', function(e){
        const rect = button.getBoundingClientRect();
        const ripple = document.createElement('span');
        const size = Math.max(rect.width, rect.height);
        ripple.className = 'ripple';
        ripple.style.width = ripple.style.height = size + 'px';
        ripple.style.left = e.clientX - rect.left - size/2 + 'px';
        ripple.style.top = e.clientY - rect.top - size/2 + 'px';
        button.appendChild(ripple);
        setTimeout(() => ripple.remove(), 600);
      });
    });
  }

  document.addEventListener('DOMContentLoaded', attachButtonAnimation);
</script>
</html>
