<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Booking Confirmed | Book My Stay</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 24px;
    font-family: Arial, Helvetica, sans-serif;
    color: white;
    background: linear-gradient(135deg, #10091d, #32104f, #110b24);
}

.card {
    width: 100%;
    max-width: 600px;
    padding: 36px;
    text-align: center;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 24px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
}

.check {
    width: 82px;
    height: 82px;
    margin: 0 auto 20px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    background: #16a765;
    font-size: 46px;
}

h1 {
    font-size: clamp(27px, 5vw, 38px);
    margin-bottom: 12px;
}

h1 span {
    color: #ff4b96;
}

.subtitle {
    color: #ddd;
    line-height: 1.6;
    margin-bottom: 25px;
}

.details {
    text-align: left;
    background: rgba(0,0,0,0.22);
    border-radius: 15px;
    padding: 20px;
    margin-bottom: 25px;
}

.details h2 {
    font-size: 19px;
    margin-bottom: 15px;
    color: #ff70aa;
}

.detail {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    padding: 11px 0;
    border-bottom: 1px solid rgba(255,255,255,0.1);
}

.detail:last-child {
    border-bottom: none;
}

.detail span:first-child {
    color: #ccc;
}

.detail span:last-child {
    text-align: right;
    overflow-wrap: anywhere;
}

.total {
    color: #ffe16b;
    font-weight: bold;
    font-size: 20px;
}

.note {
    font-size: 13px;
    color: #bbb;
    line-height: 1.6;
    margin-bottom: 24px;
}

.actions {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 12px;
}

.btn {
    display: inline-block;
    padding: 13px 22px;
    border: none;
    border-radius: 25px;
    background: linear-gradient(135deg, #ff414e, #ff278c);
    color: white;
    font-weight: bold;
    text-decoration: none;
    cursor: pointer;
}

.btn.secondary {
    background: rgba(255,255,255,0.14);
}

.error {
    color: #ffd1d1;
    line-height: 1.6;
}

@media (max-width: 480px) {
    .card {
        padding: 24px 18px;
    }

    .detail {
        font-size: 14px;
    }
}

@media print {
    body {
        background: white;
        color: black;
    }

    .card, .details {
        background: white;
        box-shadow: none;
        border: 1px solid #ddd;
    }

    .subtitle, .note, .detail span:first-child {
        color: #444;
    }

    .actions {
        display: none;
    }
}
</style>
</head>

<body>
<main class="card">
    <div class="check" aria-hidden="true">✓</div>

    <h1>Booking <span>Confirmed!</span></h1>
    <p class="subtitle">
        Thank you for choosing Book My Stay.
        Here are your booking details.
    </p>

    <section class="details" id="bookingDetails">
        <h2>Your Reservation</h2>
        <p class="error">Loading your booking details...</p>
    </section>

    <p class="note">
        This page confirms the booking details entered in this browser.
        It does not by itself create a database reservation or process payment.
    </p>

    <div class="actions">
        <a class="btn" href="index.html">Back to Home</a>
        <button class="btn secondary" onclick="window.print()">Print Details</button>
    </div>
</main>

<script>
const container = document.getElementById("bookingDetails");
let booking = null;

try {
    booking = JSON.parse(
        sessionStorage.getItem("bookMyStayBooking") || "null"
    );
} catch (error) {
    booking = null;
}

if (!booking) {
    container.innerHTML = `
        <h2>No Booking Details Found</h2>
        <p class="error">
            Please return to the booking form and submit your details again.
        </p>
    `;
} else {
    // Use textContent to safely display user-entered values.
    const rows = [
        ["Booking ID", booking.bookingId],
        ["Guest Name", booking.name],
        ["Email", booking.email],
        ["Room", booking.room],
        ["Check-in", booking.checkIn],
        ["Check-out", booking.checkOut],
        ["Number of Nights", booking.nights],
        ["Total Price", "₹" + Number(booking.total).toLocaleString("en-IN")]
    ];

    container.replaceChildren();

    const heading = document.createElement("h2");
    heading.textContent = "Your Reservation";
    container.appendChild(heading);

    rows.forEach(([label, value]) => {
        const row = document.createElement("div");
        row.className = "detail";

        const left = document.createElement("span");
        left.textContent = label;

        const right = document.createElement("span");
        right.textContent = value ?? "";

        if (label === "Total Price") {
            right.className = "total";
        }

        row.append(left, right);
        container.appendChild(row);
    });
}
</script>
</body>
</html>
